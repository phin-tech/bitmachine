name: TapSpike
options:
  bundleIdPrefix: tech.phin
  deploymentTarget:
    macOS: "14.2"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: J35P7AJDN7
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Developer ID Application"
    ENABLE_HARDENED_RUNTIME: YES
    OTHER_CODE_SIGN_FLAGS: "--timestamp=none"
targets:
  TapSpike:
    type: application
    platform: macOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.phin.bitmachine
        PRODUCT_NAME: TapSpike
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSAudioCaptureUsageDescription: "TapSpike measures audio levels to test whether BitMachine's visualizer can see Apple Music playback."
        INFOPLIST_KEY_NSAppleMusicUsageDescription: "TapSpike plays one Apple Music song to test the visualizer."
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        CODE_SIGN_ENTITLEMENTS: TapSpike.entitlements
