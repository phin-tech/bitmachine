name: BitMachine
options:
  bundleIdPrefix: tech.phin
  # Matches the Xcode in use, so it does not offer to "update to recommended settings" on every regenerate.
  xcodeVersion: "26.6"
  deploymentTarget:
    macOS: "14.2"
settings:
  base:
    # The release version (`just release` tags v<this>). `just bump` sets both. Project-wide, so anything embedded
    # in the app carries the app's version and build number.
    MARKETING_VERSION: "0.2.5"
    # The build number Sparkle and App Store Connect compare: it only ever goes up.
    CURRENT_PROJECT_VERSION: "7"
packages:
  BitMachine:
    path: .
  # In-place updates (App/UpdateChecker.swift), for the Developer ID build only. app-release reads this version to
  # fetch the matching appcast tools.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
targets:
  # The Developer ID build: notarized, published on GitHub, updated by Sparkle.
  BitMachine:
    type: application
    platform: macOS
    sources: [App]
    # A shared scheme, generated every time: without one, Xcode can remember a scheme that a regenerate
    # removed and then show no way to build or archive the app.
    scheme: {}
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    dependencies:
      - package: BitMachine
        product: BitMachineKit
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.phin.bitmachine
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: BitMachine
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        ENABLE_HARDENED_RUNTIME: YES
        DEAD_CODE_STRIPPING: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # xcodegen writes these from the properties below; Generated/ is gitignored.
    entitlements:
      path: Generated/BitMachine.entitlements
      properties: {}
    info:
      path: Generated/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSAppleMusicUsageDescription: BitMachine plays and searches Apple Music for you.
        NSAudioCaptureUsageDescription: BitMachine listens to Apple Music playback to drive its visualizer, equalizer and volume.
        # Sparkle: the appcast is an asset of the newest GitHub release (`just appcast` uploads it), and
        # updates must be signed by the private key in Infisical (SPARKLE_PRIVATE_KEY, the phin-tech-store project).
        SUFeedURL: https://github.com/phin-tech/bitmachine/releases/latest/download/appcast.xml
        SUPublicEDKey: 2mirghhdXOaz0RtSlgkR5MOzQxF+QkubzK9tgq8eO8U=
        SUEnableAutomaticChecks: true
